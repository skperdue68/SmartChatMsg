name: Lua regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run ESO fixture tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*_spec.lua; do
            echo "Running $test"
            lua5.1 "$test"
          done
